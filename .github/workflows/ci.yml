#
# Build, unit-test and smoke-test on every push and pull request.
#
# Linux only: Faultline measures coverage with kcov and reads `/proc`, so it runs on Linux and
# nowhere else. The smoke tests run every example under `examples/` against the tool built from
# this commit.
#
name: CI

env:
  ZIG_VERSION: "0.16.0"
  KCOV_VERSION: "v43"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  # The unit tests need no kcov, so they run on a runner of their own while the smoke tests build
  # kcov and run every example.
  unit-test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: zig build
        run: zig build

      - name: zig build test
        run: zig build test --summary all

  smoke-test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # kcov built from its tagged source, so every run uses the same kcov whatever the runner's
      # package archive holds. The build is kept between runs and made again only when the tag or
      # the runner image changes.
      - name: Restore kcov
        id: kcov-cache
        uses: actions/cache@v4
        with:
          path: ~/kcov
          key: kcov-${{ env.KCOV_VERSION }}-ubuntu-24.04

      # The packages are installed on every run, because kcov needs their libraries to run as well
      # as to build.
      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake binutils-dev libssl-dev libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev
          if [ "${{ steps.kcov-cache.outputs.cache-hit }}" != "true" ]; then
              git clone --branch "$KCOV_VERSION" --depth 1 https://github.com/SimonKagstrom/kcov.git "$RUNNER_TEMP/kcov"
              cmake -S "$RUNNER_TEMP/kcov" -B "$RUNNER_TEMP/kcov/build" -DCMAKE_INSTALL_PREFIX="$HOME/kcov"
              cmake --build "$RUNNER_TEMP/kcov/build" --parallel
              cmake --install "$RUNNER_TEMP/kcov/build"
          fi
          echo "$HOME/kcov/bin" >> "$GITHUB_PATH"
          "$HOME/kcov/bin/kcov" --version

      - name: Smoke tests
        run: bash scripts/smoke.sh
